<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サーバー対応タスク管理アプリ</title>
<style>
  body{ background-color: #f5f6fa; padding:0; margin:0; font-family: Arial, sans-serif;}
  header{ background-color: #007bff; color:white; padding:20px 0; text-align:center; font-size:1.6em; box-shadow:0 3px 8px rgba(0,0,0,0.15); font-weight:600; letter-spacing:1px;}
  .container{ max-width:700px; background:#FFF; padding:25px 30px; border-radius:15px; margin:30px auto; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
  .input-area, .search-area, .filter-area, .sort-area, .category-area, .category-delete-area{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:25px; margin-top:5px;}
  input[type="text"], input[type="date"], select{ flex:1; padding:8px 10px; border:1px solid #CCC; border-radius:8px; font-size:14px; transition:border-color 0.2s;}
  input:focus, select:focus{ outline:none; border-color:#007bff; box-shadow:0 0 4px rgba(0,123,255,0.3);}
  button{ padding:8px 14px; border:none; border-radius:6px; cursor:pointer; background-color: #007bff; color:white; font-size:14px; transition:background 0.2s,transform 0.1s;}
  button:hover{ background-color:#0056b3; transform:translateY(-1px);}
  ul{ list-style:none; padding:0; margin:0;}
  li{ background:white; margin-bottom:12px; padding:14px 16px; border-radius:10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display:flex; gap:10px; justify-content:space-between; align-items:flex-start; transition:transform 0.2s,box-shadow 0.2s;}
  li:hover{ transform:translateY(-3px); box-shadow:0 3px 8px rgba(0,0,0,0.12);}
  li.completed span{ text-decoration:line-through; color:#aaa;}
  .high{ border-left:8px solid #e74c3c;}
  .medium{ border-left:8px solid #f39c12;}
  .low{ border-left:8px solid #27ae60;}
  .overdue{ background-color:#fff0f0;}
  .due-today{ background-color:#fffbe6;}
  .section-title{ font-size:1.1em; font-weight:600; color:#007bff; margin:25px 0 10px; padding-left:10px; border-left:4px solid #007bff; background-color: #f0f8ff; border-radius:6px; padding:6px 10px; letter-spacing:0.5px;}
  .task-left { display:flex; flex-direction:column; gap:5px; flex:1;}
  .task-left-row { display:flex; gap:10px; align-items:center;}
  .task-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; min-width:120px;}
  @media(max-width:600px){ .input-area, .filter-area, .sort-area, .category-area, .category-delete-area{ flex-direction:column; align-items:stretch;} button{ width:100%;}}
  .task-buttons button{ margin-left:5px; font-size:12px; padding:5px 10px;}
  .edit-input{ flex:1; margin-right:10px; padding:8px; border:1px solid #ccc; border-radius:5px;}
</style>
</head>
<body>
<header>タスク管理アプリ</header>
<div class="container">
  <h2 class="section-title">タスク追加</h2>
  <div class="input-area">
    <input type="text" id="taskInput" placeholder="タスクを入力">
    <input type="text" id="descInput" placeholder="詳細説明(任意)">
    <input type="date" id="dueDateInput">
    <select id="prioritySelector">
      <option value="high">高</option>
      <option value="medium" selected>中</option>
      <option value="low">低</option>
    </select>
    <select id="categorySelector"></select>
    <button id="addBtn">追加</button>
  </div>

  <h2 class="section-title">カテゴリ管理</h2>
  <div class="category-area">
    <input type="text" id="newCategoryInput" placeholder="新しいカテゴリを入力">
    <button id="addCategoryBtn">カテゴリ追加</button>
  </div>
  <div class="category-delete-area">
    <select id="deleteCategorySelector"></select>
    <button id="deleteCategoryBtn">カテゴリ削除</button>
  </div>

  <h2 class="section-title">タスク検索</h2>
  <div class="search-area">
    <input type="text" id="searchInput" placeholder="タスクを検索">
    <button id="searchClearBtn">クリア</button>
  </div>

  <h2 class="section-title">タスクフィルタ</h2>
  <div class="filter-area">
    <select id="filterStatus">
      <option value="all">すべて</option>
      <option value="completed">完了のみ</option>
      <option value="incomplete">未完了のみ</option>
    </select>
    <select id="filterPriority">
      <option value="all">全優先度</option>
      <option value="high">高</option>
      <option value="medium">中</option>
      <option value="low">低</option>
    </select>
    <select id="filterCategory">
      <option value="all">全カテゴリ</option>
    </select>
  </div>

  <h2 class="section-title">タスク並び替え</h2>
  <div class="sort-area">
    <select id="sortSelector">
      <option value="created">作成日時順</option>
      <option value="dueDate">期限順</option>
      <option value="priority">優先度順</option>
    </select>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
const taskInput = document.getElementById("taskInput");
const descInput = document.getElementById("descInput");
const dueDateInput = document.getElementById("dueDateInput");
const prioritySelector = document.getElementById("prioritySelector");
const categorySelector = document.getElementById("categorySelector");
const newCategoryInput = document.getElementById("newCategoryInput");
const addCategoryBtn = document.getElementById("addCategoryBtn");
const deleteCategorySelector = document.getElementById("deleteCategorySelector");
const deleteCategoryBtn = document.getElementById("deleteCategoryBtn");
const addBtn = document.getElementById("addBtn");
const searchInput = document.getElementById("searchInput");
const searchClearBtn = document.getElementById("searchClearBtn");
const filterStatus = document.getElementById("filterStatus");
const filterPriority = document.getElementById("filterPriority");
const filterCategory = document.getElementById("filterCategory");
const sortSelector = document.getElementById("sortSelector");
const taskList = document.getElementById("taskList");

let tasks = [];
let categories = [];

async function fetchTasks(){
  const res = await fetch("/tasks");
  tasks = await res.json();
  renderTasks();
}

async function fetchCategories(){
  const res = await fetch("/categories");
  categories = await res.json();
  renderCategories();
}

function renderCategories(){
  categorySelector.innerHTML="";
  filterCategory.innerHTML='<option value="all">全カテゴリ</option>';
  deleteCategorySelector.innerHTML="";
  for(const cat of categories){
    const opt1 = document.createElement("option"); opt1.value=cat; opt1.textContent=cat; categorySelector.appendChild(opt1);
    const opt2 = document.createElement("option"); opt2.value=cat; opt2.textContent=cat; filterCategory.appendChild(opt2);
    const opt3 = document.createElement("option"); opt3.value=cat; opt3.textContent=cat; deleteCategorySelector.appendChild(opt3);
  }
}

addCategoryBtn.addEventListener("click", async ()=>{
  const name = newCategoryInput.value.trim();
  if(!name || categories.includes(name)) return;
  await fetch("/categories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  newCategoryInput.value="";
  fetchCategories();
});

deleteCategoryBtn.addEventListener("click", async ()=>{
  const name = deleteCategorySelector.value;
  if(!name || name==="その他"){ alert("「その他」は削除できません"); return;}
  await fetch(`/categories/${encodeURIComponent(name)}`, {method:"DELETE"});
  fetchCategories();
  fetchTasks();
});

addBtn.addEventListener("click", async ()=>{
  const text = taskInput.value.trim();
  if(!text) return;
  const task = {
    text,
    description: descInput.value.trim(),
    priority: prioritySelector.value,
    dueDate: dueDateInput.value,
    category: categorySelector.value
  };
  await fetch("/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(task)});
  taskInput.value=""; descInput.value=""; dueDateInput.value="";
  fetchTasks();
});

function renderTasks() {
  taskList.innerHTML = "";
  const today = new Date().toISOString().slice(0, 10);
  const keyword = searchInput.value.trim().toLowerCase();
  let sorted = [...tasks];
  const sortType = sortSelector.value;

  if (sortType === "created") sorted.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  else if (sortType === "dueDate") sorted.sort((a,b)=>{
    if(!a.dueDate) return 1;
    if(!b.dueDate) return -1;
    return new Date(a.dueDate)-new Date(b.dueDate);
  });
  else if(sortType==="priority"){ const order={high:1,medium:2,low:3}; sorted.sort((a,b)=>order[a.priority]-order[b.priority]); }

  for(const task of sorted){
    if(keyword && !task.text.toLowerCase().includes(keyword)) continue;
    if(filterStatus.value==="completed" && !task.completed) continue;
    if(filterStatus.value==="incomplete" && task.completed) continue;
    if(filterPriority.value!=="all" && task.priority!==filterPriority.value) continue;
    if(filterCategory.value!=="all" && task.category!==filterCategory.value) continue;

    const li = document.createElement("li");
    li.classList.add(task.priority);
    if(task.completed) li.classList.add("completed");

    // 左ブロック
    const leftDiv = document.createElement("div");
    leftDiv.classList.add("task-left");

    const row1 = document.createElement("div");
    row1.classList.add("task-left-row");
    const titleSpan = document.createElement("span");
    titleSpan.textContent = task.text;
    const catSpan = document.createElement("span");
    catSpan.textContent = task.category || "未分類";
    row1.appendChild(titleSpan);
    row1.appendChild(catSpan);

    const row2 = document.createElement("div");
    row2.classList.add("task-left-row");
    const descSpan = document.createElement("span");
    descSpan.textContent = task.description || "";
    row2.appendChild(descSpan);

    leftDiv.appendChild(row1);
    leftDiv.appendChild(row2);

    // 完了チェックボックス
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;
    checkbox.addEventListener("change", async ()=>{
      await fetch(`/tasks/${task.id}`,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...task, completed: checkbox.checked})
      });
      fetchTasks();
    });
    leftDiv.appendChild(checkbox);

    // 右ブロック
    const rightDiv = document.createElement("div");
    rightDiv.classList.add("task-right");

    const dueSpan = document.createElement("span");
    if(task.dueDate) dueSpan.textContent = `期限：${task.dueDate}`;
    rightDiv.appendChild(dueSpan);

    const delBtn = document.createElement("button");
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", async ()=>{
      await fetch(`/tasks/${task.id}`, {method:"DELETE"});
      fetchTasks();
    });
    rightDiv.appendChild(delBtn);

    li.appendChild(leftDiv);
    li.appendChild(rightDiv);
    taskList.appendChild(li);
  }
}

searchInput.addEventListener("input", renderTasks);
searchClearBtn.addEventListener("click", ()=>{ searchInput.value=""; renderTasks(); });
filterStatus.addEventListener("change", renderTasks);
filterPriority.addEventListener("change", renderTasks);
filterCategory.addEventListener("change", renderTasks);
sortSelector.addEventListener("change", renderTasks);

window.addEventListener("DOMContentLoaded", ()=>{
  fetchCategories();
  fetchTasks();
});
</script>
</body>
</html>
