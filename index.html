<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンマの一日 — ダンマパダとスッタニパータ</title>
  <style>
    :root {
      --bg: #f7f3ed;
      --surface: #fffcf7;
      --primary: #8b6914;
      --primary-light: #c4a035;
      --accent: #5c4a32;
      --text: #2c2416;
      --text-muted: #6b5d4a;
      --border: #e8dfd0;
      --success: #4a7c59;
      --shadow: 0 4px 20px rgba(92, 74, 50, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #6b4f1d 0%, #8b6914 50%, #a07d2a 100%);
      color: #fff;
      padding: 28px 20px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(92, 74, 50, 0.2);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    header p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    nav button.active,
    nav button:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0 0 12px;
    }

    .date-badge {
      display: inline-block;
      background: #f0e8d8;
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      margin-bottom: 16px;
    }

    .verse-block {
      border-left: 4px solid var(--primary-light);
      padding: 16px 20px;
      margin: 16px 0;
      background: #faf6ef;
      border-radius: 0 12px 12px 0;
    }

    .verse-pali {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .verse-ja {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.8;
    }

    .source-tag {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--primary);
      background: #f5edd8;
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .theme-badge {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--success);
      border: 1px solid var(--success);
      padding: 2px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }

    .action-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .action-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .action-list li:last-child { border-bottom: none; }

    .action-list input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 3px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .action-list label {
      cursor: pointer;
      flex: 1;
    }

    .action-list input:checked + label {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .practice-grid {
      display: grid;
      gap: 10px;
    }

    .practice-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #faf6ef;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }

    .practice-item.done {
      background: #eef5ef;
      border-color: #c5dcc9;
    }

    .practice-item input {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
    }

    .practice-item label {
      cursor: pointer;
      flex: 1;
      font-size: 0.95rem;
    }

    .practice-item .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      background: #faf6ef;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(196, 160, 53, 0.2);
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0 4px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: right;
    }

    .teaching-list-item {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
    }

    .teaching-list-item:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow);
    }

    .teaching-list-item.today {
      border-color: var(--primary);
      background: #faf6ef;
    }

    .teaching-list-item .title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .teaching-list-item .preview {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .history-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-child { border-bottom: none; }

    .history-date {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 600;
    }

    .history-summary {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button.primary-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    button.primary-btn:hover { background: #6b4f1d; }

    button.secondary-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .intro-text {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.25rem; }
      .card { padding: 18px; }
      .verse-ja { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ダンマの一日</h1>
    <p>ダンマパダとスッタニパータ — 毎日の行動の指針</p>
  </header>

  <nav>
    <button class="active" data-panel="today">今日</button>
    <button data-panel="teachings">教え一覧</button>
    <button data-panel="history">記録</button>
  </nav>

  <main>
    <section id="panel-today" class="panel active">
      <div class="card">
        <p class="card-title">今日の教え</p>
        <div class="date-badge" id="todayDate"></div>
        <div id="todayTeaching"></div>
      </div>

      <div class="card">
        <p class="card-title">今日の行動指針</p>
        <p class="intro-text">教えに基づき、今日意識してみる具体的な行動です。できたものにチェックを入れましょう。</p>
        <div class="progress-bar"><div class="progress-fill" id="actionProgress"></div></div>
        <p class="progress-text" id="actionProgressText"></p>
        <ul class="action-list" id="actionList"></ul>
      </div>

      <div class="card">
        <p class="card-title">日々の実践</p>
        <p class="intro-text">スッタニパータ「吉祥経」などに示される、毎日の土台となる七つの実践です。</p>
        <div class="progress-bar"><div class="progress-fill" id="practiceProgress"></div></div>
        <p class="progress-text" id="practiceProgressText"></p>
        <div class="practice-grid" id="practiceList"></div>
      </div>

      <div class="card">
        <p class="card-title">夜の振り返り</p>
        <p class="intro-text">今日、教えをどう生きたか。怒りや感謝、気づきを自由に書き留めてください。</p>
        <textarea id="reflectionInput" placeholder="例：午後、同僚の言葉に怒りそうになったが、一呼吸置いて穏やかに返せた。明日は朝の挨拶を大切にしたい。"></textarea>
        <div class="btn-row">
          <button class="primary-btn" id="saveReflection">振り返りを保存</button>
        </div>
      </div>
    </section>

    <section id="panel-teachings" class="panel">
      <div class="card">
        <p class="card-title">教えの一覧</p>
        <p class="intro-text">31の教えが日替わりで巡ります。タップすると詳細を表示します。</p>
        <div id="teachingCatalog"></div>
      </div>
    </section>

    <section id="panel-history" class="panel">
      <div class="card">
        <p class="card-title">実践の記録</p>
        <p class="intro-text">過去の振り返りと、その日の達成率です。</p>
        <div id="historyList"></div>
      </div>
    </section>
  </main>

  <script>

          "今日の選択が、未来の自分に幸福をもたらすか問う",

      },
      {
        source: "ダンマパダ",

        verseJa: "健康こそ最大の利得である。知足こそ最大の富である。信頼こそ最大の親族である。涅槃こそ最高の幸福である。",

          "過度な欲望を手放し、今を満たす"
        ]
      },
      {
        source: "ダンマパダ",
        ref: "第二十四品 愛欲品 第349偈",
        theme: "執着",
        verseJa: "愛欲の束縛から解き放たれた者は、苦しみから解き放たれる。愛欲を捨てた者は、すべての苦しみを捨てる。",
        actions: [
          "執着しているもの（物、意見、関係）を一つ特定する",

          "執着が苦しみを生むと気づく"
        ]
      },
      {
        source: "ダンマパダ",
        ref: "第二十六品 聖者品 第383偈",
        theme: "聖なる生",
        verseJa: "苦の終わりを見た者は、迷いの林を超えた。すべての束縛を断ち切り、苦しみを超えた。",
        actions: [
          "今日の苦しみの根源を一つ、静かに観察する",
          "執着を手放す小さな練習を一つ行う",
          "「これも変わる」と、困難な状況に対して思う",

      },
      {
        source: "スッタニパータ",
        ref: "慈経（メッター・スッター）",
        theme: "慈しみ",
        verseJa: "自分自身の安楽を願うように、すべての存在に慈しみを向けよ。上も下も横も、障害なく、敵意なく、危害なく。",
        actions: [
          "朝、自分と大切な人、中立の人、困難な人に慈しみを送る",

          "批判の前に、相手の幸福を願う",
          "自分自身にも、厳しさではなく慈しみを向ける"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "慈経",
        theme: "慈しみ",
        verseJa: "立っていようと、歩いていようと、坐っていようと、横たわっていようと、眠らない間は、慈しみの心を保て。",
        actions: [
          "移動中（通勤・買い物）にも慈しみの心を保つ",
          "待ち時間を、慈しみの瞑想の機会にする",
          "イライラしたとき、慈しみの言葉を心の中で唱える",
          "就寝前に、今日出会った人々への慈しみを振り返る"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "吉祥経（マンガラ・スッター）",
        theme: "吉祥",
        verseJa: "父母を敬い、家族を大切にし、穏やかな生業を持ち、正しい行いをせよ。これが最大の吉祥である。",
        actions: [
          "父母や育ててくれた人への感謝を伝える（心の中でも可）",
          "家族や身近な人に、今日一つ具体的な親切をする",
          "仕事や学びを、誠実かつ穏やかに行う",
          "不正な手段を使わず、正しい道を選ぶ"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "吉祥経",
        theme: "吉祥",
        verseJa: "布施と法を尊重し、長老を敬い、謙虚で誠実な者に接せよ。これが最大の吉祥である。",
        actions: [
          "今日、与えることを一つ行う（時間、知識、物）",
          "年長者や経験者の話を、敬意をもって聴く",

      },
      {
        source: "スッタニパータ",
        ref: "吉祥経",
        theme: "吉祥",
        verseJa: "怒りと慢心を捨て、謙虚で従順な者と交わり、困ったとき助けを求め、感謝を忘れない。これが最大の吉祥である。",
        actions: [
          "今日、慢心（自分を高める心）に気づいたら手放す",
          "謙虚な人との会話を大切にする",
          "困ったとき、助けを求める勇気を持つ",
          "受け取った恩恵に、感謝を述べる"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "経集 第三 大章",
        theme: "正しい生",
        verseJa: "怒りを捨て、慢心を捨て、すべての束縛を超えよ。苦しみに打ち勝ち、執着のない者は、真の幸福を知る。",
        actions: [
          "慢心を刺激する状況（SNS、競争）から距離を置く",
          "今日、執着を手放せた場面を一つ探す",
          "苦しみを増やす比較をやめる",
          "シンプルな生活の中に幸福を見出す"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "経集 第四 八品 第15経",
        theme: "正しい言葉",
        verseJa: "真実を語り、優しく語り、有益なことを語れ。法に沿った言葉を語る者は、後悔しない。",
        actions: [
          "今日、真実から外れた言葉を一つも口にしない",
          "厳しい言葉を、優しい表現に変えて伝える",
          "相手のためになる言葉だけを選ぶ",
          "言った後に後悔する発言を避ける"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "経集 第一 有学品",
        theme: "学び",
        verseJa: "善き友を得よ。謙虚で、学ぶ意欲のある者と交われ。そうすれば、苦しみの終わりに近づく。",
        actions: [
          "今日、善き友（自分を良い方向に導く人）に連絡する",
          "学びの時間を意図的に確保する",
          "自分より知識や経験のある人から学ぶ",
          "悪い影響を与える関係に距離を置く"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "経集 第二 小章",
        theme: "平静",
        verseJa: "世界の譽れも非難も、喜びも悲しみも、得失も、心を動かすものではない。平静な者は、真の自由を知る。",
        actions: [
          "誉れられても、非難されても、心を動かさない練習をする",
          "他人の評価に一喜一憂しない",
          "得ても失っても、平静を保つ",
          "今日、最も平静でいられた瞬間を記録する"
        ]
      },
      {
        source: "スッタニパータ",
        ref: "経集 第五 大章",
        theme: "道",
        verseJa: "この岸から彼の岸へ渡る者は、恐怖を超え、束縛を断ち切り、迷いの林を抜け出す。",
        actions: [
          "今日、一歩でも「苦しみの少ない方向」に進む",
          "恐れに直面し、小さくでも行動する",
          "迷いの中で、教えを指針として立ち返る",
          "彼岸（安楽）への道を、日々の行いで歩む"
        ]
      }
    ];

    const DAILY_PRACTICES = [
      { id: "ahimsa", label: "害を与えない", hint: "生き物を傷つけず、言葉でも身体でも" },
      { id: "truth", label: "正直に話す", hint: "真実で、相手のためになる言葉を" },
      { id: "no-theft", label: "取らない・盗まない", hint: "他人の時間・物・信用を不当に奪わない" },
      { id: "mindful-speech", label: "正しい言葉を選ぶ", hint: "怒り、中傷、無益な話を控える" },
      { id: "contentment", label: "足るを知る", hint: "過度な欲望を手放し、今を満たす" },
      { id: "effort", label: "精進する", hint: "善い習慣を一つ、今日も続ける" },
      { id: "mindfulness", label: "正念を保つ", hint: "少なくとも一度、呼吸に意識を向ける" },
      { id: "gratitude", label: "感謝を述べる", hint: "誰か一人に、感謝を伝える" }
    ];

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDateJa(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;
    }

    function dayIndex() {
      const start = new Date(new Date().getFullYear(), 0, 0);
      const now = new Date();
      const diff = now - start;
      return Math.floor(diff / (1000 * 60 * 60 * 24)) % TEACHINGS.length;
    }

    function loadDayData() {
      const key = "dhamma-day-" + todayKey();
      return JSON.parse(localStorage.getItem(key)) || {
        actions: {},
        practices: {},
        reflection: ""
      };
    }

    function saveDayData(data) {
      const key = "dhamma-day-" + todayKey();
      localStorage.setItem(key, JSON.stringify(data));
      updateHistoryIndex(todayKey(), data);
    }

    function updateHistoryIndex(date, data) {
      const index = JSON.parse(localStorage.getItem("dhamma-history")) || [];
      const teaching = TEACHINGS[dayIndexForDate(date)];
      const actionTotal = teaching.actions.length;
      const actionDone = Object.values(data.actions || {}).filter(Boolean).length;
      const practiceDone = Object.values(data.practices || {}).filter(Boolean).length;
      const entry = {
        date,
        theme: teaching.theme,
        source: teaching.source,
        actionRate: Math.round((actionDone / actionTotal) * 100),
        practiceRate: Math.round((practiceDone / DAILY_PRACTICES.length) * 100),
        reflection: (data.reflection || "").slice(0, 80)
      };
      const existing = index.findIndex(e => e.date === date);
      if (existing >= 0) index[existing] = entry;
      else index.unshift(entry);
      localStorage.setItem("dhamma-history", JSON.stringify(index.slice(0, 60)));
    }

    function dayIndexForDate(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const start = new Date(d.getFullYear(), 0, 0);
      const diff = d - start;
      return Math.floor(diff / (1000 * 60 * 60 * 24)) % TEACHINGS.length;
    }

    function renderTeaching(teaching, containerId, showFull) {
      const el = document.getElementById(containerId);
      el.innerHTML = `
        <div class="verse-block">
          <p class="verse-ja">${teaching.verseJa}</p>
        </div>
        <span class="source-tag">${teaching.source} — ${teaching.ref}</span>
        <span class="theme-badge">${teaching.theme}</span>
      `;
    }

    function renderActions(teaching, dayData) {
      const list = document.getElementById("actionList");
      list.innerHTML = "";
      teaching.actions.forEach((action, i) => {
        const li = document.createElement("li");
        const id = "action-" + i;
        const checked = !!dayData.actions[id];
        li.innerHTML = `
          <input type="checkbox" id="${id}" ${checked ? "checked" : ""}>
          <label for="${id}">${action}</label>
        `;
        li.querySelector("input").addEventListener("change", function() {
          dayData.actions[id] = this.checked;
          saveDayData(dayData);
          updateProgress(teaching, dayData);
        });
        list.appendChild(li);
      });
      updateProgress(teaching, dayData);
    }

    function renderPractices(dayData) {
      const grid = document.getElementById("practiceList");
      grid.innerHTML = "";
      DAILY_PRACTICES.forEach(p => {
        const div = document.createElement("div");
        const checked = !!dayData.practices[p.id];
        div.className = "practice-item" + (checked ? " done" : "");
        div.innerHTML = `
          <input type="checkbox" id="practice-${p.id}" ${checked ? "checked" : ""}>
          <label for="practice-${p.id}">
            ${p.label}
            <span class="hint">${p.hint}</span>
          </label>
        `;
        div.querySelector("input").addEventListener("change", function() {
          dayData.practices[p.id] = this.checked;
          div.classList.toggle("done", this.checked);
          saveDayData(dayData);
          updatePracticeProgress(dayData);
        });
        grid.appendChild(div);
      });
      updatePracticeProgress(dayData);
    }

    function updateProgress(teaching, dayData) {
      const total = teaching.actions.length;
      const done = teaching.actions.filter((_, i) => dayData.actions["action-" + i]).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("actionProgress").style.width = pct + "%";
      document.getElementById("actionProgressText").textContent = `${done} / ${total} 完了（${pct}%）`;
    }

    function updatePracticeProgress(dayData) {
      const done = DAILY_PRACTICES.filter(p => dayData.practices[p.id]).length;
      const pct = Math.round((done / DAILY_PRACTICES.length) * 100);
      document.getElementById("practiceProgress").style.width = pct + "%";
      document.getElementById("practiceProgressText").textContent = `${done} / ${DAILY_PRACTICES.length} 完了（${pct}%）`;
    }

    function renderToday() {
      const idx = dayIndex();
      const teaching = TEACHINGS[idx];
      const dayData = loadDayData();

      document.getElementById("todayDate").textContent = formatDateJa(todayKey());
      renderTeaching(teaching, "todayTeaching", true);
      renderActions(teaching, dayData);
      renderPractices(dayData);

      const reflectionInput = document.getElementById("reflectionInput");
      reflectionInput.value = dayData.reflection || "";
    }

    function renderCatalog() {
      const catalog = document.getElementById("teachingCatalog");
      const todayIdx = dayIndex();
      catalog.innerHTML = "";
      TEACHINGS.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "teaching-list-item" + (i === todayIdx ? " today" : "");
        div.innerHTML = `
          <div class="title">${t.source} — ${t.theme}${i === todayIdx ? " （今日）" : ""}</div>
          <div class="preview">${t.verseJa.slice(0, 60)}…</div>
        `;
        div.addEventListener("click", function() {
          alert(`${t.source} ${t.ref}\n\n${t.verseJa}\n\n【今日の行動指針】\n${t.actions.map((a, n) => `${n + 1}. ${a}`).join("\n")}`);
        });
        catalog.appendChild(div);
      });
    }

    function renderHistory() {
      const list = document.getElementById("historyList");
      const index = JSON.parse(localStorage.getItem("dhamma-history")) || [];
      if (index.length === 0) {
        list.innerHTML = '<div class="empty-state">まだ記録がありません。<br>今日の実践と振り返りを始めましょう。</div>';
        return;
      }
      list.innerHTML = index.map(e => `
        <div class="history-item">
          <div class="history-date">${formatDateJa(e.date)} — ${e.source}「${e.theme}」</div>
          <div class="history-summary">
            行動指針 ${e.actionRate}% ／ 日々の実践 ${e.practiceRate}%
            ${e.reflection ? " ／ " + e.reflection + (e.reflection.length >= 80 ? "…" : "") : ""}
          </div>
        </div>
      `).join("");
    }

    document.querySelectorAll("nav button").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        this.classList.add("active");
        document.getElementById("panel-" + this.dataset.panel).classList.add("active");
        if (this.dataset.panel === "teachings") renderCatalog();
        if (this.dataset.panel === "history") renderHistory();
      });
    });

    document.getElementById("saveReflection").addEventListener("click", function() {
      const dayData = loadDayData();
      dayData.reflection = document.getElementById("reflectionInput").value.trim();
      saveDayData(dayData);
      this.textContent = "保存しました";
      setTimeout(() => { this.textContent = "振り返りを保存"; }, 1500);
    });

    renderToday();
  </script>
</body>
</html>
