<!--
概要
LocalStorageを活用したタスク管理アプリケーションを 開発してください。

必須要件
1. 基本機能
 タスクの追加、編集、削除
 タスクの完了/未完了の切り替え
 すべてのデータをLocalStorageに永続化
 OK

2. 高度な機能
 優先度設定（高・中・低）と色分け表示
 期限設定と期限切れの視覚的な表示
 カテゴリ分け（仕事、プライベート、勉強など、自由に追加可能）
 検索機能（タスク名での部分一致検索）
 フィルター機能
完了/未完了での絞り込み
優先度での絞り込み
カテゴリでの絞り込み
 ソート機能
作成日時順
期限順
優先度順
3. データ構造
各タスクは最低限以下の情報を持つこと：

javascript

{
  id: number,           // 一意のID
  title: string,        // タスク名
  description: string,  // 詳細説明（任意）
  priority: string,     // 'high' | 'medium' | 'low'
  category: string,     // カテゴリ名
  dueDate: string,      // 期限(日付)
  completed: boolean,   // 完了状態
  createdAt: string,    // 作成日時
  updatedAt: string     // 更新日時
}

ヒント
LocalStorageの基本操作
javascript

// 保存
localStorage.setItem('key', JSON.stringify(data));

// 読み込み
const data = JSON.parse(localStorage.getItem('key'));

// 削除

// すべて削除
localStorage.clear();

javascript

// 全体のデータ構造
{

}
期限切れの判定
javascript

javascript

const filtered = tasks.filter(task => {
  // 複数条件での絞り込み
  return (
    task.completed === filterCompleted &&
    task.priority === filterPriority &&
    task.category === filterCategory
  );
});

-->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
<title>LocalStorageを活用したタスク管理アプリケーション</title>
<style>
  body{
    background-color: #f5f6fa;
    padding:0;
    margin:0;
  }
  header{
    background-color: #007bff;
    color:white;
    padding:20px 0;
    text-align:center;
    font-size:1.6em;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    font-weight:600;
    letter-spacing:1px;
  }
  nav{
    background-color:#FFF;
    display:flex;
    justify-content: center;
    gap:10px;
    padding:10px 0;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    position: sticky;
    top:0;
    z-index:100;
  }
  nav button{
    background-color:transparent;
    border:none;
    color:#333;
    padding:8px 18px;
    font-size:15px;
    cursor:pointer;
    border-radius:25px;
    transition:all 0.2s ease;
  }
  nav button.active, nav button:hover{
    background-color: #007bff;
    color:#FFF;
    box-shadow:0 2px 6px rgba(0,123,255,0.3);
  }

  .container{
    max-width:700px;
    background:#FFF;
    padding:25px 30px;
    border-radius:15px;
    margin:30px auto;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
  }
  h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
  }

  .input-area,
  .search-area,
  .filter-area,
  .sort-area,
  .category-area,
  .category-delete-area{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
    margin-top:5px;
  }
  input[type="text"],
  input[type="date"],
  select{
    flex:1;
    padding:8px 10px;
    border:1px solid #CCC;
    border-radius:8px;
    font-size:14px;
    transition:border-color 0.2s;
  }
  input:focus,
  select:focus{
    outline:none;
    border-color:#007bff;
    box-shadow:0 0 4px rgba(0,123,255,0.3);
  }

  button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background-color: #007bff;
    color:white;
    font-size:14px;
    transition:background 0.2s,transform 0.1s;
  }
  button:hover{
    background-color:#0056b3;
    transform:translateY(-1px);
  }
  ul{
    list-style:none;
    padding:0;
    margin:0;
  }
  li{
    background:white;
    margin-bottom:12px;
    padding:14px 16px;
    border-radius:10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display:flex;
    flex-direction: column;
    gap:5px;
    transition:transform 0.2s,box-shadow 0.2s;
  }
  li:hover{
    transform:translateY(-3px);
    box-shadow:0 3px 8px rgba(0,0,0,0.12);
  }
  .task-main-row{
    display:flex;
    align-items:center;
    gap:6px;
    justify-content: space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  .task-buttons button{
    padding:5px 8px;
    font-size:12px;
    border-radius:4px;
    background-color: #6c757d;
  }
  .task-buttons button:hover{
    background-color: #495057;;
  }

  li.completed span{
    text-decoration:line-through;
    color:#aaa;
  }
  /*期限関連のスタイル*/
  .due-date{
    font-size:12px;
    color:#555;
  }
  /*優先度色分け表示*/
  .high{
    border-left:8px solid #e74c3c;
  }
  .medium{
    border-left:8px solid #f39c12;
  }
  .low{
    border-left:8px solid #27ae60;
  }

/* ===============================
   期限状態
=============================== */
  .overdue{
    background-color:#fff0f0;
  }
  .due-today{
    background-color:#fffbe6;
  }

/* ===============================
   カテゴリバッジ
=============================== */
.category-badge{
  background-color: #eef1f5;
  border-radius:12px;
  padding:3px 8px;
  font-size:12px;
  color:#333;
  font-weight:500;
}

/* ===============================
   編集モード
=============================== */
  .task-buttons button{
    margin-left:5px;
    font-size:12px;
    padding:5px 10px;
  }
  .edit-input{
    flex:1;
    margin-right:10px;
    padding:8px;
    border:1px solid #ccc;
    border-radious:5px;
  }
/* ===============================
   セクション見出しデザイン
=============================== */
.section-title{
  font-size:1.1em;
  font-weight:600;
  color:#007bff;
  margin:25px 0 10px;
  padding-left:10px;
  border-left:4px solid #007bff;
  background-color: #f0f8ff;
  border-radius:6px;
  padding:6px 10px;
  letter-spacing:0.5px;
}
  
/* ===============================
   レスポンシブ対応
=============================== */
  @media(max-width:600px){
    nav{
      flex-wrap:wrap;
    }
    .input-area,
    .filter-area,
    .sort-area,
    .category-area,
    .category-delete-area{
      flex-direction:column;
      align-items:stretch;
    }
    button{
      width:100%;
    }
  }

</style>
</head>
<body>
  <header>タスク管理アプリ</header>
  <div class="container">
    <h2 class="section-title">タスク追加</h2>
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="タスクを入力">

      <!--詳細説明-->
      <input type="text" id="descInput" placeholder="詳細説明(任意)">
      <input type="date" id="dueDateInput">

      <!--優先度色分け表示-->
      <select id="prioritySelector">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>

      <!--カテゴリ追加欄-->
      <select id="categorySelector"></select>
      <button id="addBtn">追加</button>
    </div>

    <!--カテゴリ追加欄-->
    <h2 class="section-title">カテゴリ管理</h2>
    <div class="category-area">
      <input type="text" id="newCategoryInput" placeholder="新しいカテゴリを入力">
      <button id="addCategoryBtn">カテゴリ追加</button>
    </div>

    <!---カテゴリ削除--->
    <div class="category-delete-area">
      <select id="deleteCategorySelector"></select>
      <button id="deleteCategoryBtn">カテゴリ削除</button>
    </div>

    <!--検索機能-->
    <h2 class="section-title">タスク検索</h2>
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="タスクを検索">
      <button id="searchClearBtn">クリア</button>
    </div>

    <!--フィルタ機能-->
    <h2 class="section-title">タスクフィルタ</h2>
    <div class="filter-area">
      <select id="filterStatus">
        <option value="all">すべて</option>
        <option value="completed">完了のみ</option>
        <option value="incomplete">未完了のみ</option>
      </select>
      <select id="filterPriority">
        <option value="all">全優先度</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
      <select id="filterCategory">
        <option value="all">全カテゴリ</option>
      </select>
    </div>

    <!--ソート機能-->
    <h2 class="section-title">タスク並び替え</h2>
    <div class="sort-area">
      <select id="sortSelector">
        <option value="created">作成日時順</option>
        <option value="dueDate">期限順</option>
        <option value="priority">優先度順</option>
      </select>
    </div>

    <ul id="taskList"></ul>
  </div>

    <script>
      /**
       * input要素にvalueをセットしつつ、HTML属性としてのvalueを除去する。
       * 「ページのソースを表示」やDOMインスペクターに生の値が表示されなくなる。
       *
       * - element.value = val  → DOMプロパティのみ更新（View Sourceに出ない）
       * - removeAttribute('value') → HTMLソース上の value="" 属性を除去
       */
      function setSecureValue(element, val) {
        element.value = val;
        element.removeAttribute("value");
      }

      /**
       * サーバーからBase64エンコードされた値を data-encoded-value 属性で
       * 受け取り、JSでデコードしてDOMプロパティにセットするパターン。
       *
       * 使用例（HTML側）:
       *   <input type="hidden" data-encoded-value="44OG44K544OI" id="secretField">
       *
       * 使用例（JS側）:
       *   decodeSecureData(document.getElementById("secretField"));
       */
      function decodeSecureData(element) {
        const encoded = element.getAttribute("data-encoded-value");
        if (encoded) {
          element.value = decodeURIComponent(atob(encoded));
          element.removeAttribute("data-encoded-value");
          element.removeAttribute("value");
        }
      }

      const taskInput = document.getElementById("taskInput");
       /*詳細説明*/
      const descInput = document.getElementById("descInput");
      const addBtn = document.getElementById("addBtn");
      const taskList = document.getElementById("taskList");
      /*優先度色分け表示*/
      const prioritySelector = document.getElementById("prioritySelector");
      /*期限表示*/
      const dueDateInput = document.getElementById("dueDateInput");
      /*カテゴリ追加*/
      const categorySelector = document.getElementById("categorySelector");
      const newCategoryInput = document.getElementById("newCategoryInput");
      const addCategoryBtn = document.getElementById("addCategoryBtn");
      /*カテゴリ削除*/
      const deleteCategorySelector = document.getElementById("deleteCategorySelector");
      const deleteCategoryBtn = document.getElementById("deleteCategoryBtn");
      /*検索機能*/
      const searchInput = document.getElementById("searchInput");
      const searchClearBtn = document.getElementById("searchClearBtn");
      /*フィルター*/
      const filterStatus = document.getElementById("filterStatus");
      const filterPriority = document.getElementById("filterPriority");
      const filterCategory = document.getElementById("filterCategory");
      /*ソート機能*/
      const sortSelector = document.getElementById("sortSelector");
     
      //---LocalStrageからデータ読み込み---
      let data = JSON.parse(localStorage.getItem("key")) || [];
      let categories = JSON.parse(localStorage.getItem("categories")) || ["仕事","プライベート","その他"];
      let editIndex = null; //編集中のインデックスを保持
      let currentView = "all";

      //---カテゴリ表示更新---
      function renderCategories(){
        categorySelector.innerHTML = "";
        filterCategory.innerHTML = '<option value="all">全カテゴリ</option>';
        deleteCategorySelector.innerHTML = "";
        for(let i=0;i<categories.length;i++){
          const category = categories[i];

          //タスク追加用カテゴリ選択欄
          const opt1 = document.createElement("option");
          opt1.value = category;
          opt1.textContent = category;
          categorySelector.appendChild(opt1);

          //フィルタ選択用カテゴリ選択欄
          const opt2 = document.createElement("option");
          opt2.value = category;
          opt2.textContent = category;
          filterCategory.appendChild(opt2);

          //カテゴリ削除
          const opt3 = document.createElement("option");
          opt3.value = category;
          opt3.textContent = category;
          deleteCategorySelector.appendChild(opt3);
        }
        if(categories.length>0){
          setSecureValue(categorySelector, categories[0]);
        }
      }

      //---カテゴリ追加---
      addCategoryBtn.addEventListener("click", function(){
        const newCat = newCategoryInput.value.trim();
        if(newCat === "" || categories.includes(newCat)){
          return;
        }
        categories.push(newCat);
        setSecureValue(newCategoryInput, "");
        localStorage.setItem("categories",JSON.stringify(categories));
        renderCategories();
      });

      //---カテゴリ削除処理
      deleteCategoryBtn.addEventListener("click", function(){
        const targetCat = deleteCategorySelector.value;
        if(!targetCat){
          return;
        }
        //「その他」を削除しようとしたらブロック
        if(targetCat === "その他"){
          alert("「その他」カテゴリは削除できません");
          return;
        }
        //タスクに削除カテゴリがあれば「その他」に振替
        for(let i=0;i<data.length;i++){
          if(data[i].category === targetCat){
            data[i].category = "その他";
          }
        }
        //カテゴリを削除
        categories = categories.filter(cat => cat !== targetCat);
        //保存
        localStorage.setItem("categories",JSON.stringify(categories));
        saveTasks();

        renderCategories();
        renderTasks();
        setSecureValue(deleteCategorySelector, "");
      });

      //---タスク一覧の表示---
      function renderTasks(){
        taskList.innerHTML = "";
        //---期限関連　今日の日付(YYYY-MM-DD)---
        const today = new Date().toISOString().slice(0,10);
        //---検索キーワード---
        const keyword = searchInput.value.trim().toLowerCase();

        //---ソート処理---
        let sortedData = [...data];//元データをコピー
        const sortType = sortSelector.value;
        if(sortType === "created"){
          //作成日時順（新しい順）
          sortedData.sort((a,b)=>new Date(b.createdAt) - new Date(a.createdAt));
        }else if(sortType === "dueDate"){
          //期限順（古い順）期限なしは後ろへ
          sortedData.sort((a,b)=>{
            if(!a.dueDate){
              return 1;
            }
            if(!b.dueDate){
              return -1;
            }
            return new Date(a.dueDate) - new Date(b.dueDate); 
          });
        }else if(sortType==="priority"){
          //優先度順（高い順）
          const order = {high: 1,medium: 2, low:3};
          sortedData.sort((a,b)=>order[a.priority]-order[b.priority]);
        }

        for(let index=0;index<sortedData.length;index++){
          const task = sortedData[index];

          //---検索キーワードに部分一致しない場合はスキップ---
          if(keyword && !task.text.toLowerCase().includes(keyword)){
            continue;
          }

          //---フィルタ適用---
          if(filterStatus.value === "completed" && !task.completed){
            continue;
          }
          if(filterStatus.value === "incomplete" && task.completed){
            continue;
          }
          if(filterPriority.value !== "all" && task.priority !== filterPriority.value){
            continue;
          }
          if(filterCategory.value !== "all" && task.category !== filterCategory.value){
            continue;
          }
          if(currentView === "today" && task.dueDate !== today){
            continue;
          }
          if(currentView === "completed" && !task.completed){
            continue;
          }

          const li = document.createElement("li");
          
          //---完了状態---
          if(task.completed){
            li.classList.add("completed");
          }
          //---優先度色分け表示---
          li.classList.add(task.priority);

          //---期限判定---
          if(task.dueDate){
            if(task.dueDate<today){
              li.classList.add("overdue");
            }else if(task.dueDate === today){
              li.classList.add("due-today");
            }
          }

          //ソート後のタスク(task)に対応する、元の data 配列での位置を探す
          let originalIndex = -1;
          for(let i=0;i<data.length;i++){
            if(data[i].id === task.id){
              originalIndex = i;
              break;
            }
          }

          //---作成日・更新日---
          const topInfo = document.createElement("div");
          topInfo.classList.add("task-top-info");

          if(task.updatedAt){
            const updated = new Date(task.updatedAt);
            if(!isNaN(updated)){
              topInfo.textContent = `更新日：${updated.toLocaleDateString("ja-JP")}`;
            }
          }else if(task.createdAt){
              const created = new Date(task.createdAt);
              if(!isNaN(created)){
                topInfo.textContent = `作成日：${created.toLocaleDateString("ja-JP")}`;
              }
          }
          li.appendChild(topInfo); 

          //---チェックボックス作成---
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.addEventListener("change", function(){
            toggleTask(originalIndex);
          });

          //---テキスト---
          const span = document.createElement("span");
          span.textContent = task.text;
          span.addEventListener("click", function(){
            toggleTask(originalIndex);
          });

          //---詳細説明---
          const descSpan = document.createElement("div");
          descSpan.textContent = task.description || "";
          descSpan.style.fontSize = "12px";
          descSpan.style.color = "#555";
          descSpan.style.marginLeft = "25px";

          //---カテゴリ表示---
          const catSpan = document.createElement("span");
          catSpan.classList.add("category-badge");
          catSpan.textContent = task.category || "未分類";

          //---期限表示---
          const dueSpan = document.createElement("span");
          dueSpan.classList.add("due-date");
          if(task.dueDate){
            dueSpan.textContent = `期限：${task.dueDate}`;
          }

          //---ボタンエリア---
          const buttonArea = document.createElement("div");
          buttonArea.classList.add("task-buttons");

          //---編集ボタン---
          const editBtn = document.createElement("button");
          editBtn.textContent = "編集";
          editBtn.addEventListener("click", function(){
            editTask(originalIndex,li);
          });

          //---削除ボタン---
          const delBtn = document.createElement("button");
          delBtn.textContent = "削除";
          delBtn.addEventListener("click", function(){
            deleteTask(originalIndex);
          });

          buttonArea.appendChild(editBtn); //詳細説明編集ボタン
          buttonArea.appendChild(delBtn);

          //---チェックボックスを左に配置---
          const titleRow = document.createElement("div");
          titleRow.classList.add("task-main-row");
          titleRow.appendChild(checkbox);
          titleRow.appendChild(span);

          const infoRow = document.createElement("div");
          infoRow.classList.add("task-main-row");
          /*詳細説明*/
          infoRow.appendChild(descSpan);
          /*カテゴリ表示*/
          infoRow.appendChild(catSpan);
          /*期限表示*/
          infoRow.appendChild(dueSpan);

          const buttonRow = document.createElement("div");
          buttonRow.classList.add("task-main-row");
          buttonRow.appendChild(buttonArea);

          li.appendChild(titleRow);
          li.appendChild(infoRow);
          li.appendChild(buttonRow);

          taskList.appendChild(li);
        }
      }

      //---LocalStorageに保存---
      function saveTasks(){
        localStorage.setItem("key", JSON.stringify(data));
      }

      //---タスク追加---
      addBtn.addEventListener("click", function(){
        const text = taskInput.value.trim();
        /*詳細説明*/
        const description = descInput.value.trim();
        /*優先度色分け表示*/
        const priority = prioritySelector.value;
        /*入力された期限を取得*/
        const dueDate = dueDateInput.value;
        /*カテゴリ*/
        const category = categorySelector.value;
        if(text === ""){
          return;
        }
        if(editIndex === null){
          data.push({
            id: Date.now(), //一意のID
            text, 
            description: description || "", //詳細説明
            completed: false, 
            priority, 
            dueDate, 
            category,
            createdAt: new Date().toISOString(),
            updatedAt: null, //更新日
            updated: false //作成日、更新日を判別フラグ

          });/*priority 優先度色分け表示, dueDate 期限表示,category カテゴリ追加,createdAt 作成日時*/
        }else{
          data[editIndex].text = text;
          data[editIndex].description = description;
          data[editIndex].dueDate = dueDate;
          data[editIndex].category = category;
          editIndex = null;
          addBtn.textContent = "追加";

        }
        setSecureValue(taskInput, "");
        setSecureValue(descInput, "");
        setSecureValue(dueDateInput, "");
        saveTasks();
        renderTasks();
      });

      //---タスク削除---
      function deleteTask(index){
        data.splice(index, 1);
        saveTasks();
        renderTasks();
      }

      //---タスク編集---
      function editTask(index,li){
        const task = data[index];

        //編集モード
        li.classList.add("editing");
        li.innerHTML = "";

        //---編集モード表示---
        li.innerHTML = "";
        const textInput = document.createElement("input");
        textInput.type = "text";
        setSecureValue(textInput, task.text);
        textInput.className = "edit-input";
        textInput.placeholder = "タスク名";

        //---詳細説明---
        const descInput = document.createElement("input");
        descInput.type = "text";
        setSecureValue(descInput, task.description || "");
        descInput.className = "edit-input";
        descInput.placeholder = "詳細説明";

        //---期限---
        const dueInput = document.createElement("input");
        dueInput.type = "date";
        setSecureValue(dueInput, task.dueDate || "");

        //---優先度---
        const prioritySelect = document.createElement("select");
        const priorities = ["high","medium","low"];
        for(let i=0;i<priorities.length;i++){
          const p = priorities[i];
          const opt = document.createElement("option");
          if(p === "high"){
            opt.textContent = "高";
          }else if(p === "medium"){
            opt.textContent = "中";
          }else{
            opt.textContent = "低";
          }

          //値を設定
          opt.value = p;

          //現在のタスクの優先度と一致していれば選択状態に
          if(p===task.priority){
            opt.selected = true;
          }

          //selectに追加
          prioritySelect.appendChild(opt);
        }
        
        //---カテゴリ---
        const categorySelect = document.createElement("select");
        for(let i=0;i<categories.length;i++){
          const cat = categories[i];
          const opt = document.createElement("option");

          //値と表示文字を設定
          opt.value = cat;
          opt.textContent = cat;

          //現在のカテゴリと一致していれば選択状態に
          if(cat === task.category){
            opt.selected = true;
          }

          //selectに追加
          categorySelect.appendChild(opt);
        }

        //保存ボタン
        const saveBtn = document.createElement("button");
        saveBtn.textContent = "保存";
        saveBtn.addEventListener("click", function(){
          const newText = textInput.value.trim();
          if(newText === ""){
            alert("タスク名を入力してください");
            return;
          }
          data[index].text = newText;
          data[index].description = descInput.value;
          data[index].dueDate = dueInput.value;
          data[index].priority = prioritySelect.value;
          data[index].category = categorySelect.value;
          data[index].updatedAt = new Date().toISOString();//更新日保存
          data[index].updated = true; //更新フラグを立てる
          saveTasks();
          renderTasks();
        });

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "キャンセル";
        cancelBtn.addEventListener("click", function(){
          renderTasks();
        });

        //---編集フォームを構築---
        li.appendChild(textInput);
        li.appendChild(descInput);
        li.appendChild(dueInput);
        li.appendChild(prioritySelect);
        li.appendChild(categorySelect);
        li.appendChild(saveBtn);
        li.appendChild(cancelBtn);
      }

      //---完了・未完了の切り替え---
      function toggleTask(index){
        data[index].completed = !data[index].completed;
        saveTasks();
        renderTasks();
      }

      //---検索イベント---
      searchInput.addEventListener("input", renderTasks);
      searchClearBtn.addEventListener("click", function(){
        setSecureValue(searchInput, "");
        renderTasks();
      });

      //---フィルター変更イベント---
      filterStatus.addEventListener("change", renderTasks);
      //---優先順位変更イベント---
      filterPriority.addEventListener("change", renderTasks);
      //---フィルター変更イベント---
      filterCategory.addEventListener("change", renderTasks);
      //---ソート変更イベント---
      sortSelector.addEventListener("change", renderTasks);

      //---初期表示---
      /*初期表示時呼び出し*/
      renderCategories();
      renderTasks();
      

    </script>
 </body>
 </html>
